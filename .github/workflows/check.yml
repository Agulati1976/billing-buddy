name: Application checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BILLLOOK_TEST_POSTGRES: postgresql://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run audit:all
      - run: npx playwright install --with-deps chromium
      - name: Lint (no warnings)
        run: npm run lint
        timeout-minutes: 2
      - name: Unit, PDF and offline tests
        run: npm run test
        timeout-minutes: 3
      - name: PostgreSQL authorization and concurrency tests
        run: npm run test:database
        timeout-minutes: 3
      - name: Strict edge-function type checks
        run: npm run typecheck:edge
        timeout-minutes: 5
      - name: Edge-handler tests
        run: npm run test:edge
        timeout-minutes: 2
      - name: Type-checked production build
        run: npm run build
        timeout-minutes: 5
      - name: Desktop and mobile browser tests
        run: npx playwright test
        timeout-minutes: 4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
